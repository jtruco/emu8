name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  STATICCHECK_VERSION: "2025.1.1"

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make

      - name: Vet
        run: go vet ./...

      - name: Vet SDL tests (build tag sdltest, not run)
        run: go vet -tags sdltest ./ui/sdl/

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} ./...

      - name: Test (short)
        run: make test-short

      - name: Test (race, short)
        run: go test -race -short ./...

  zexall:
    name: Z80 zexall test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test Z80 (zexall)
        run: go test -v ./emulator/device/cpu/z80/test/
